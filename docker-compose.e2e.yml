services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: octroi
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-octroi}"
      POSTGRES_DB: octroi_e2e
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octroi"]
      interval: 5s
      timeout: 5s
      retries: 5
