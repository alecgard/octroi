server:
  host: "0.0.0.0"
  port: 9091
  read_timeout: 30s
  write_timeout: 30s

database:
  url: "postgres://octroi:${POSTGRES_PASSWORD}@localhost:5435/octroi_e2e?sslmode=disable"

proxy:
  timeout: 30s
  max_request_size: 10485760  # 10MB

metering:
  batch_size: 100
  flush_interval: 5s

rate_limit:
  default: 60
  window: 1m

cors:
  allowed_origins: []

encryption:
  key: "${OCTROI_ENCRYPTION_KEY}"
