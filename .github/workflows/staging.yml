name: Staging

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  APP_NAME: octroi-pr-${{ github.event.number }}
  DB_NAME: octroi-pr-${{ github.event.number }}-db

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app (first deploy only)
        run: |
          if ! flyctl apps list --json | jq -e ".[] | select(.Name == \"$APP_NAME\")" > /dev/null 2>&1; then
            flyctl apps create "$APP_NAME" --org personal
            flyctl postgres create --name "$DB_NAME" --org personal --region iad --vm-size shared-cpu-1x --initial-cluster-size 1 --volume-size 1
            flyctl postgres attach "$DB_NAME" --app "$APP_NAME"
            flyctl secrets set --app "$APP_NAME" \
              OCTROI_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
              OCTROI_HOST="0.0.0.0" \
              OCTROI_PORT="8080"
          fi

      - name: Deploy
        run: flyctl deploy --app "$APP_NAME" --remote-only --strategy immediate

      - name: Run migrations
        run: flyctl ssh console --app "$APP_NAME" -C "octroi migrate --config /dev/null"

      - name: Create admin user
        run: flyctl ssh console --app "$APP_NAME" -C "octroi ensure-admin" || true

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: staging
          message: |
            **Staging deployed** :rocket:

            https://${{ env.APP_NAME }}.fly.dev/ui

            Login: `admin@octroi.dev` / `octroi`

  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy app and database
        run: |
          flyctl apps destroy "$APP_NAME" --yes || true
          flyctl apps destroy "$DB_NAME" --yes || true
